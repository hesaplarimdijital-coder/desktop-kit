# Builds the kit and the sample app, runs the unit tests (including the Robolectric screenshot
# tests) and compares the screenshots with kit/src/test/screenshots. On main the screenshots are
# pushed to the ci/screenshots branch for review. Build errors and failed tests are reported as
# annotations on the commit; for a pull request from this repository the whole build output and
# the test results are also pushed to ci/logs-pr-<number>, readable with git. A second job builds
# the library as JitPack does, with Java 17.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Robolectric's two large jars. Maven Central answers GitHub's runners HTTP 429 for them at
  # random, so they come from this workflow's cache or from Google's mirror of Central (checked
  # against Central's SHA-1), never from Central. The versions follow the build; when it changes,
  # change them here (a failed test run names the version it wanted):
  # - nativeruntime-dist-compat: a dependency of Robolectric, whose version is in
  #   gradle/libs.versions.toml (4.17);
  # - android-all-instrumented: the Android the tests run on (sdk=36 in
  #   kit/src/test/resources/robolectric.properties), as Robolectric 4.17 builds it (i7).
  ROBOLECTRIC_NATIVERUNTIME: '1.0.19'
  ROBOLECTRIC_ANDROID_ALL: '16-robolectric-13921718-i7'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Robolectric needs Java 21 to run the tests on Android 16 (API 36); the kit still
          # targets Java 17 bytecode, and JitPack builds it with Java 17 (jitpack.yml)
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Robolectric's jars from the cache
        id: robolectric-jars
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-nativeruntime-${{ env.ROBOLECTRIC_NATIVERUNTIME }}-android-all-${{ env.ROBOLECTRIC_ANDROID_ALL }}

      - name: Robolectric's jars from the mirror
        env:
          CACHE_HIT: ${{ steps.robolectric-jars.outputs.cache-hit }}
        run: |
          set -euo pipefail
          repo="$HOME/.m2/repository"
          if [ "$CACHE_HIT" = true ]; then
            echo "Restored from this workflow's cache:"
            find "$repo/org/robolectric" -type f -printf '  %p (%s bytes)\n'
            exit 0
          fi
          mirror=https://maven-central.storage-download.googleapis.com/maven2
          central=https://repo1.maven.org/maven2
          fetch() { curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors "$@"; }
          for module in "nativeruntime-dist-compat:$ROBOLECTRIC_NATIVERUNTIME" "android-all-instrumented:$ROBOLECTRIC_ANDROID_ALL"; do
            artifact=${module%%:*}
            version=${module#*:}
            dir="org/robolectric/$artifact/$version"
            mkdir -p "$repo/$dir"
            for ext in pom jar; do
              name="$artifact-$version.$ext"
              # Central serves small files; its checksum is the one to trust
              if sum=$(fetch "$central/$dir/$name.sha1"); then
                from="Maven Central's SHA-1"
              else
                sum=$(fetch "$mirror/$dir/$name.sha1")
                from="the mirror's SHA-1 (Central refused its .sha1)"
                echo "::warning title=Robolectric jars::Maven Central refused $name.sha1; $name is checked against the mirror's"
              fi
              expected=$(printf '%s' "$sum" | awk '{print $1}')
              fetch -o "$RUNNER_TEMP/$name" "$mirror/$dir/$name"
              actual=$(sha1sum "$RUNNER_TEMP/$name" | awk '{print $1}')
              if [ "$actual" != "$expected" ]; then
                echo "::error title=Robolectric jars::$name from the mirror has SHA-1 $actual; $from is $expected"
                exit 1
              fi
              mv "$RUNNER_TEMP/$name" "$repo/$dir/$name"
              echo "$name: from Google's mirror of Maven Central, $(stat -c %s "$repo/$dir/$name") bytes, SHA-1 $actual = $from"
            done
          done

      # Gradle takes nativeruntime-dist-compat (that module only) from ~/.m2; Robolectric finds
      # android-all there by itself
      - name: Gradle takes Robolectric's native runtime from ~/.m2
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/robolectric-local.init.gradle.kts <<'EOF'
          // Written by CI: Robolectric's native runtime jar comes from the local Maven repository,
          // where the workflow put a copy checked against Maven Central's SHA-1. Nothing else comes
          // from there through this script.
          beforeSettings {
              dependencyResolutionManagement {
                  repositories {
                      mavenLocal {
                          content { includeModule("org.robolectric", "nativeruntime-dist-compat") }
                      }
                  }
              }
          }
          EOF

      # the design standard's mechanical checks: no new raw colours, platform toasts, dead buttons, endless
      # motion, off-scale sizes or shouting strings (tools/design_check.py; known ones are in its baseline)
      - name: Design standard
        run: python3 tools/design_check.py

      - name: Build and test
        run: |
          ./gradlew :kit:testDebugUnitTest :kit:publishToMavenLocal :sample:assembleDebug \
            --continue --stacktrace --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Annotate errors
        if: failure()
        run: |
          python3 tools/annotate_gradle_errors.py build.log
          python3 tools/annotate_test_failures.py kit/build/test-results

      - name: Push logs to ci/logs-pr-<number>
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          TARGET: ci/logs-pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/logs"
          rm -rf "$out" && mkdir -p "$out"
          [ -f build.log ] && cp build.log "$out/"
          [ -d kit/build/test-results ] && cp -r kit/build/test-results "$out/"
          echo "${HEAD_SHA}" > "$out/HEAD_SHA"
          cd "$out"
          git init -q && git checkout -q --orphan "$TARGET"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Logs for ${HEAD_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET"

      - name: Compare screenshots
        if: always()
        run: |
          pip install --quiet pillow
          python3 tools/screenshot_report.py kit/build/outputs/screenshots kit/src/test/screenshots kit/build/outputs/screenshots/diff

      - name: Push screenshots to ci/screenshots
        # main: ci/screenshots; a pull request from this repository: ci/screenshots-pr-<number>, for review
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          TOKEN: ${{ github.token }}
          TARGET: ${{ github.event_name == 'pull_request' && format('ci/screenshots-pr-{0}', github.event.pull_request.number) || 'ci/screenshots' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          src=kit/build/outputs/screenshots
          [ -d "$src" ] || exit 0
          out="$RUNNER_TEMP/screenshots"
          rm -rf "$out" && cp -r "$src" "$out"
          cd "$out"
          git init -q && git checkout -q --orphan "$TARGET"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots for ${HEAD_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET"

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: kit/build/outputs/screenshots

      - name: Sample APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: kit/build/reports/tests

  # What JitPack does with a tag (jitpack.yml): the library alone, with Java 17. Run here so a
  # tag never meets a build that only works with the Java 21 the tests need.
  jitpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build as JitPack does
        run: ./gradlew :kit:publishToMavenLocal -PVERSION_NAME=2.0.0-ci --console=plain
