[versions]
# Compose 1.12 needs AGP 9.1.1+ and compileSdk 37
agp = "9.4.1"
# AGP 9 compiles Kotlin itself (built-in Kotlin); see the root build file for how this version is used.
# Haze 2 is built with Kotlin 2.4, so the kit needs 2.3 or newer to read it.
kotlin = "2.4.20"
# Compose 1.12.1
composeBom = "2026.09.00"
activityCompose = "1.13.0"
core = "1.19.1"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
coroutines = "1.11.0"
haze = "2.0.1"
junit = "4.13.2"
# 4.16+ runs Android 16 (API 36), on Java 21
robolectric = "4.17"
testCore = "1.7.0"
testExtJunit = "1.3.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core = { module = "androidx.core:core", version.ref = "core" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Never applied (AGP 9 compiles Kotlin itself); declared in the root build file only to pin the Kotlin version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
